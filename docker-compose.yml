services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studyteach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studyteach
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: studyteach
    ports:
      # Host 5433 -> container 5432 to avoid conflict with any local Postgres
      # already bound to 5432 (Postgres.app, brew, system install).
      - '5433:5432'
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studyteach -d studyteach']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: studyteach-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ./docker/data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
