name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: studyteach
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: studyteach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyteach -d studyteach"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://studyteach:dev@localhost:5432/studyteach
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-not-for-production
      CSRF_SECRET: ci-csrf-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @studyteach/api run db:migrate
      - run: pnpm build
      - run: pnpm test
