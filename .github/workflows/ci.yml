name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: studyteach
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: studyteach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyteach -d studyteach"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://studyteach:dev@localhost:5432/studyteach
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-not-for-production
      CSRF_SECRET: ci-csrf-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      # Order matters: Node must be available before pnpm self-installs
      # (pnpm 11.1.2 requires Node ≥22.13). Then we re-invoke setup-node
      # WITH `cache: pnpm` so the cache key computation can find pnpm.
      # This is GitHub's documented pattern for pnpm + setup-node caching.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          # The default installer goes via npm, which fails pnpm 11's
          # engines.node check against the action's bundled Node runtime
          # (still Node 20). standalone:true downloads a self-contained
          # pnpm binary and skips the engine guard entirely.
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @studyteach/api run db:migrate
      # Mint dev ticket + content-pack signing keys (idempotent). The integration
      # suite reads these JWK files from apps/api/keys/; they are gitignored so
      # CI mints fresh keys on every run.
      - run: pnpm --filter @studyteach/api run keys:mint
      # Seed the catalog data the integration tests assume exists. Order doesn't
      # matter — each ingest is idempotent on a natural key.
      - run: pnpm --filter @studyteach/api run db:seed
      - run: pnpm --filter @studyteach/api run ingest:curriculum
      - run: pnpm --filter @studyteach/api run ingest:practice
      - run: pnpm --filter @studyteach/api run ingest:egsh
      - run: pnpm --filter @studyteach/api run ingest:olympiads
      - run: pnpm --filter @studyteach/api run ingest:academy
      - run: pnpm --filter @studyteach/api run ingest:study-abroad
      - run: pnpm build
      - run: pnpm test

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: studyteach
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: studyteach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyteach -d studyteach"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://studyteach:dev@localhost:5432/studyteach
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-not-for-production
      CSRF_SECRET: ci-csrf-secret-not-for-production
      NEXT_PUBLIC_API_BASE: http://localhost:4000
      NODE_ENV: development # session cookie must be `st-sid`, not `__Host-st-sid`
    steps:
      - uses: actions/checkout@v4
      # Mirror the build job's node + pnpm bootstrap exactly — same order,
      # same standalone:true workaround for pnpm 11 + Node 20 in the action.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── DB + secrets + content packs (same recipe as `build`) ────────────
      - run: pnpm --filter @studyteach/api run db:migrate
      - run: pnpm --filter @studyteach/api run keys:mint
      - run: pnpm --filter @studyteach/api run db:seed
      - run: pnpm --filter @studyteach/api run ingest:curriculum
      - run: pnpm --filter @studyteach/api run ingest:practice
      - run: pnpm --filter @studyteach/api run ingest:egsh
      - run: pnpm --filter @studyteach/api run ingest:olympiads
      - run: pnpm --filter @studyteach/api run ingest:academy
      - run: pnpm --filter @studyteach/api run ingest:study-abroad

      # We need the production builds because `pnpm dev` would also work
      # but produces noisy logs and is slower under CI. `build` runs the
      # API's `nest build` and the web's `next build`.
      - run: pnpm build

      # Playwright browsers. Chromium only — Firefox/WebKit are not in scope
      # for the smoke pass and roughly triple the install time.
      - run: pnpm exec playwright install --with-deps chromium

      # Boot API (writes pid + log to /tmp) then web. Both in background.
      # We block on a basic HTTP readiness probe (curl loop) rather than
      # sleep — sleeps are forbidden by the qa-test-engineer constraint.
      - name: Boot API + web servers
        run: |
          mkdir -p /tmp/mozateach-logs
          (cd apps/api && nohup node dist/main.js > /tmp/mozateach-logs/api.log 2>&1 & echo $! > /tmp/mozateach-logs/api.pid)
          (nohup pnpm --filter @studyteach/web start > /tmp/mozateach-logs/web.log 2>&1 & echo $! > /tmp/mozateach-logs/web.pid)
          # Readiness: wait up to 90s for both ports.
          for i in $(seq 1 45); do
            api_ok=$(curl -fs -o /dev/null http://localhost:4000/me; echo $?)
            # /me returns 401 when not logged in; that's still "API up".
            api_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/me)
            web_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
            if [ "$api_status" != "000" ] && [ "$web_status" != "000" ]; then
              echo "API: $api_status, web: $web_status — ready"
              exit 0
            fi
            sleep 2
          done
          echo "Servers failed to come up in time"
          tail -n 100 /tmp/mozateach-logs/api.log || true
          tail -n 100 /tmp/mozateach-logs/web.log || true
          exit 1

      - run: pnpm test:e2e

      # Upload the HTML report on failure for triage.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: /tmp/mozateach-logs/
          retention-days: 7
