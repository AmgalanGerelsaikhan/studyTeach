<!doctype html>
<html lang="mn-Cyrl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MozaTeach · Холболтгүй</title>
    <style>
      :root {
        --st-cream: #f4e8d1;
        --st-soot: #2a1810;
        --st-ember: #c2410c;
        --st-brass: #b98438;
        --st-ink-2: #5c4530;
      }
      html,
      body {
        margin: 0;
        background: var(--st-cream);
        color: var(--st-soot);
        font-family:
          Manrope,
          -apple-system,
          Segoe UI,
          'Noto Sans',
          'Noto Serif Mongolian',
          sans-serif;
        min-height: 100vh;
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }
      h1 {
        font-family: Bitter, Georgia, serif;
        font-size: 1.8rem;
        margin: 0.5rem 0;
      }
      p {
        color: var(--st-ink-2);
        line-height: 1.55;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.3rem 0.7rem;
        border-radius: 999px;
        background: var(--st-soot);
        color: #fbf3e2;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }
      .card {
        background: #fbf3e2;
        border: 1px solid rgba(185, 132, 56, 0.4);
        border-radius: 16px;
        padding: 1.25rem 1.5rem;
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="pill">MozaTeach</span>
      <h1>Холболтгүй байна</h1>
      <p>Та одоо интернэт холболтгүй байна. Хадгалсан хичээл, билет, AI Багшийн өчигдрийн яриа боломжтой хэвээр байна.</p>
      <div class="card">
        <p style="margin: 0; font-weight: 600">Гүйцэтгэсэн үйлдлүүд бүгд автоматаар илгээгдэнэ.</p>
        <p style="margin: 0.5rem 0 0; font-size: 0.85rem">Холболт сэргэхэд хадгалсан мэдээллүүд серверт хүрнэ.</p>
      </div>
    </main>
  </body>
</html>
